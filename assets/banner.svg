<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1e2a44"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .ray { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 1012px 196px; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .9; transform: scale(1.25); } }
      .scan { animation: scan 3.2s ease-in-out infinite; }
      @keyframes scan { 0%,100% { opacity: .15; } 50% { opacity: .55; } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- left text block -->
  <rect x="64" y="70" width="4" height="150" rx="2" fill="url(#accent)"/>
  <text x="92" y="118" class="t" font-size="46" font-weight="700" fill="#f1f5f9">Xuanhui (Henry) Weng</text>
  <text x="92" y="160" class="t" font-size="22" font-weight="500" fill="url(#accent)">Robotics Vision  ·  Embedded AI  ·  Full-Stack</text>
  <text x="92" y="200" class="t" font-size="17" fill="#94a3b8">MS Computer Science @ Northwestern  ·  San Francisco Bay Area</text>
  <text x="92" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#64748b">$ open to full-time roles, 2027<tspan class="blink" fill="#38bdf8"> ▍</tspan></text>

  <!-- right: robot arm + stereo camera -->
  <g transform="translate(0,0)">
    <!-- camera frustum / scan -->
    <polygon points="1100,58 960,230 1070,236" fill="#38bdf8" class="scan"/>
    <line x1="1100" y1="58" x2="1012" y2="196" stroke="#38bdf8" stroke-width="2" class="ray"/>
    <rect x="1078" y="44" width="48" height="22" rx="5" fill="#1e293b" stroke="#475569"/>
    <circle cx="1090" cy="55" r="5" fill="#0ea5e9"/>
    <circle cx="1114" cy="55" r="5" fill="#0ea5e9"/>

    <!-- base -->
    <rect x="820" y="246" width="110" height="16" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="852" y="226" width="46" height="22" rx="4" fill="#273449" stroke="#334155"/>
    <!-- links -->
    <line x1="875" y1="226" x2="910" y2="130" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
    <line x1="910" y1="130" x2="990" y2="170" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="875" cy="226" r="11" fill="#0b1220" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="910" cy="130" r="10" fill="#0b1220" stroke="#818cf8" stroke-width="3"/>
    <circle cx="990" cy="170" r="8" fill="#0b1220" stroke="#818cf8" stroke-width="3"/>
    <!-- gripper -->
    <path d="M990 170 L1000 186 M990 170 L1006 176" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <!-- target -->
    <circle cx="1012" cy="196" r="26" fill="url(#glow)" class="pulse"/>
    <rect x="1000" y="186" width="24" height="22" rx="3" fill="none" stroke="#f472b6" stroke-width="2"/>
    <text x="1028" y="184" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#f472b6">cup 0.97</text>
  </g>
</svg>
